plugins {
     id 'com.android.application'
}

android {
    namespace = "org.generalsx.zerohour"
    compileSdkVersion 35
    ndkVersion = "27.2.12479018"
    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    // GeneralsX @port Android — a committed debug key. Without it every CI runner (and every
    // developer machine) signs with a freshly generated ~/.android/debug.keystore, so each new
    // APK fails to install over the previous one (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and the
    // player has to uninstall, losing the 2.6 GB of imported game data. Debug keys are not
    // secrets; this is the standard Android debug key material (alias/passwords "android").
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // GeneralsX @port Android — use PREBUILT native libs (engine cross-compiled separately
    // via NDK+CMake+vcpkg); do NOT build native under Gradle.
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // GeneralsX @port Android self-contained: the bundled game-data zip (~2.2GB of already-
    // compressed .big/.bik) is STORED, not re-compressed — keeps the build fast and lets the
    // first-run extractor stream it straight out of the APK.
    androidResources {
        noCompress 'pak'
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
}
